name: CI

permissions:
  contents: write

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify package.json
        run: |
          echo "Checking package.json..."
          node -e "const pkg = require('./package.json'); console.log('Name:', pkg.name); console.log('Version:', pkg.version); console.log('Main:', pkg.main); console.log('Exports:', JSON.stringify(pkg.exports, null, 2));"

      - name: Verify main entry point
        run: |
          echo "Testing import..."
          node --experimental-vm-modules -e "
            import('./index.js').then(mod => {
              console.log('Plugin loaded successfully');
              console.log('Plugin ID:', mod.default.id);
            }).catch(err => {
              console.error('Failed to load plugin:', err);
              process.exit(1);
            });
          "

      - name: Verify source files exist
        run: |
          test -f src/env-redactor.js && echo "✓ src/env-redactor.js exists"
          test -f index.js && echo "✓ index.js exists"
          test -f package.json && echo "✓ package.json exists"
          test -f README.md && echo "✓ README.md exists"
          test -f LICENSE && echo "✓ LICENSE exists"

      - name: Check for required exports in env-redactor
        run: |
          node -e "
            import('./src/env-redactor.js').then(mod => {
              const required = [
                'REDACTION_PLACEHOLDER',
                'SECRET_FILE_PATTERNS',
                'SAFE_ENV_FILE_EXCEPTIONS',
                'parseEnvText',
                'isSensitiveValue',
                'buildSafeEnvRepresentation',
                'redactKnownSecrets',
                'createEnvRedactionManager'
              ];
              for (const exp of required) {
                if (typeof mod[exp] === 'undefined') {
                  console.error('Missing export:', exp);
                  process.exit(1);
                }
              }
              console.log('✓ All required exports present');
            }).catch(err => {
              console.error('Failed to import env-redactor:', err);
              process.exit(1);
            });
          "

  publish:
    needs: lint-and-test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}